site_name: HIMLT Documentation
site_description: Hybrid Interactive Machine Learning Tool — setup, architecture, and usage documentation
site_author: Deepthi Kondreddy
site_url: https://Hybrid_Interactive_Machine_Learning_Tool/readthedocs.io/en/latest/
copyright: "© 2026 Deepthi kondreddy@Kennesaw State university — NSF Grant No. 2409704"

use_directory_urls: false
theme:
  name: readthedocs
  custom_dir: overrides
  highlightjs: true
  navigation_depth: 3
  collapse_navigation: false
  titles_only: false
  
  

nav:
  - Home: index.md
  - Project Overview: overview.md
  - Deployment Guide: deployment.md
  - Using HIMLT: using.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

