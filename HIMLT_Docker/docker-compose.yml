version: '3.8'
services:
  db:
    image: deepcse/himlt:db
    container_name: himlt_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - himlt_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - himlt_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: himlt_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - himlt_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: deepcse/himlt:web
    container_name: himlt_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - himlt_net
    volumes:
      - himlt_checkpoints:/app/checkpoints

  worker:
    image: deepcse/himlt:worker
    container_name: himlt_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - himlt_net
    volumes:
      - himlt_checkpoints:/app/checkpoints
      - himlt_images:/data/GBM_shared
    healthcheck:
      test: ["CMD", "test", "-f", "/data/GBM_shared/TCGA-19-2620-01Z-00-DX1.b52311cf-5861-4653-9d87-bcc3389874ef.tif"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  iipimage:
    image: iipsrv/iipsrv:latest
    container_name: himlt_iipimage
    restart: unless-stopped
    environment:
      - IIIF_VERSION=3
      - CORS=*
    volumes:
      - himlt_images:/images:ro
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - himlt_net

volumes:
  himlt_mysql_data:
    driver: local
  himlt_checkpoints:
    driver: local
  himlt_images:
    driver: local

networks:
  himlt_net:
    driver: bridge
